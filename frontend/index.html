<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Security Monitor</title>
    <!--
      No web-font <link> here on purpose. The app's own CSP
      (app/main.py: style-src 'self' 'unsafe-inline') blocks third-party
      stylesheets, so a Google Fonts link was silently failing and the UI
      fell back to system fonts anyway. Rather than widen the CSP, the font
      stack in tailwind.config.js uses locally-available faces: it keeps the
      policy tight, drops a third-party runtime dependency (and the request
      that sends every user's IP to Google), and works in the air-gapped
      environments a self-hosted security tool is often deployed into.
    -->
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
