sonar.projectKey=DharuneshBoopathy_Secure-api
sonar.organization=dharuneshboopathy

# Coverage produced by `pytest` (see pytest.ini --cov-report=xml) and by
# `npm run test` in frontend/.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.python.version=3.12

# --- Analysis scope -------------------------------------------------------
#
# Excluded because these are not deployed and are not part of the attack
# surface. This is scoping, not suppression: everything that ships — app/,
# frontend/src/, alembic/, k8s/, the Dockerfile and both workflows — stays in
# scope, and the real findings in them were fixed rather than excluded.
#
#   loadtest/       Synthetic traffic generators. Every finding here is S2245
#                   ("pseudorandom number generator"), raised on the
#                   Math.random()/random.choice() calls used to vary fake
#                   request paths and status codes. Unpredictability is not a
#                   property a load generator needs, and swapping in
#                   secrets.SystemRandom would make it slower for no benefit.
#   frontend/e2e/   Playwright fixtures and the seed script they call, run
#                   against a throwaway local database.
#   scripts/        Local operator utilities (demo seeding, data reset). Not
#                   packaged into the image — see the Dockerfile's COPY list.
sonar.exclusions=loadtest/**,frontend/e2e/**,scripts/**,**/node_modules/**,frontend/dist/**

# Test sources are analyzed, but with the test-appropriate rule set rather than
# the production one.
sonar.tests=tests,frontend/src
sonar.test.inclusions=tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.coverage.exclusions=tests/**,alembic/**,loadtest/**,scripts/**,frontend/e2e/**
