sonar.projectKey=DharuneshBoopathy_Secure-api
sonar.organization=dharuneshboopathy

sonar.python.version=3.12

# Coverage, produced by `pytest` (pytest.ini sets --cov-report=xml) and by
# `npm run test` in frontend/.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.exclusions=tests/**,alembic/**,loadtest/**,scripts/**,frontend/e2e/**

# NOTE: the project currently uses SonarQube Cloud's Automatic Analysis, which
# does NOT apply the exclusions below — verified empirically, by declaring them
# and watching the excluded files keep reporting. They take effect only if
# analysis moves to a CI-run scanner (SonarSource/sonarqube-scan-action plus a
# SONAR_TOKEN secret), so they are kept here as configuration for that switch
# rather than as something load-bearing today.
#
# Because they do not apply, nothing was silenced by exclusion: the findings in
# loadtest/ and frontend/e2e/ were fixed in the code instead. The load
# generators no longer draw from Math.random()/random — the request mix is now
# derived deterministically, which a benchmark wants anyway, since it makes two
# runs comparable.
sonar.exclusions=**/node_modules/**,frontend/dist/**
