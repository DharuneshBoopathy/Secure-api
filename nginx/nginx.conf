worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Map Authorization header to a boolean flag for safe logging.
    # SECURITY: Never log raw Authorization/JWT values.
    map $http_authorization $has_auth {
        default "false";
        "~."    "true";
    }

    # JSON access log for the monitor (Levo-style: ship gateway logs to inventory)
    log_format apimonitor_json escape=json '{'
        '"ts":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"auth_present":$has_auth,'
        '"user_agent":"$http_user_agent",'
        '"gateway":"nginx-local"'
    '}';

    access_log  /var/log/nginx/apimonitor_access.json  apimonitor_json;

    upstream apimonitor_backend {
        server web:8000;
    }

    limit_req_zone $binary_remote_addr zone=api_rate:10m rate=20r/s;

    server {
        listen       80;
        server_name  localhost;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        location /api/ {
            limit_req zone=api_rate burst=40 nodelay;
            proxy_pass         http://apimonitor_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /metrics {
            # Allow Prometheus container and localhost only
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://apimonitor_backend;
        }

        location / {
            proxy_pass         http://apimonitor_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
