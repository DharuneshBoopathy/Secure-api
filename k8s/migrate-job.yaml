# Run once before rolling out a new image (see the CD workflow's "migrate"
# step): `kubectl delete job apimonitor-migrate --ignore-not-found && \
#          kubectl apply -f k8s/migrate-job.yaml && \
#          kubectl wait --for=condition=complete job/apimonitor-migrate --timeout=120s`
# The delete-first step is needed because Job names aren't mutable in place
# — re-applying the same name without deleting the old (already-Complete)
# Job first is a no-op, not a re-run.
apiVersion: batch/v1
kind: Job
metadata:
  name: apimonitor-migrate
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      # This Job talks to the database, never to the Kubernetes API, so the
      # default-mounted service account token is credential it has no use for
      # — and one more thing to steal if the migration image is ever tampered
      # with.
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: ghcr.io/OWNER/REPO:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: apimonitor-config
            - secretRef:
                name: apimonitor-secrets
          # Alembic on this schema is not memory-hungry; the limit exists so an
          # unbounded Job cannot compete with the web and worker pods for node
          # memory. The other workloads declare limits already.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
