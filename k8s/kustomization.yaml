apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# secret.yaml (copied from secret.example.yaml with real values, or created
# via `kubectl create secret generic`) and migrate-job.yaml (run explicitly
# before a rollout, not on every apply — see the comment in that file) are
# deliberately not listed here. Everything else: `kubectl apply -k k8s/`.
resources:
  - configmap.yaml
  - redis.yaml
  - deployment-web.yaml
  - deployment-worker.yaml
  - hpa.yaml
