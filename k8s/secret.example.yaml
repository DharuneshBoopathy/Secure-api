# Template only — deliberately not named secret.yaml and not listed in
# kustomization.yaml, so it can't be applied by accident with placeholder
# values still in it.
#
# Two ways to actually create this Secret:
#   1. `kubectl create secret generic apimonitor-secrets \
#        --from-literal=DATABASE_URL=... --from-literal=MONITOR_API_KEY=$(openssl rand -base64 32) \
#        --from-literal=SECRET_KEY=$(openssl rand -base64 32) --from-literal=ADMIN_PASSWORD=...`
#   2. Fill in real values below, `cp secret.example.yaml secret.yaml`,
#      `kubectl apply -f secret.yaml`, then add secret.yaml to
#      kustomization.yaml's resources — do NOT commit secret.yaml.
#
# For a fleet running an external secrets operator (Vault, AWS/GCP Secrets
# Manager — see app/services/secrets_provider.py for the same providers the
# app itself can read from directly), point that operator at this Secret's
# name/keys instead of hand-creating it.
apiVersion: v1
kind: Secret
metadata:
  name: apimonitor-secrets
type: Opaque
stringData:
  DATABASE_URL: "mysql+pymysql://apimonitor:CHANGEME@your-mysql-host:3306/apimonitor"
  MONITOR_API_KEY: "CHANGEME-min-32-random-chars"
  SECRET_KEY: "CHANGEME-min-32-random-chars"
  ADMIN_PASSWORD: "CHANGEME-strong-password"
