[pytest]
testpaths = tests
pythonpath = .
# Gate set just under actual coverage (~74%) so a real regression trips it.
# It was 40%, which left room to delete a third of the test suite unnoticed.
# Raise it as coverage climbs; don't lower it to make a red build green.
addopts = -q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70
