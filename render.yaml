# Render Blueprint — free-plan deployment of the released image.
#
# Render's free plan needs no payment card, which is what rules the cloud VMs
# out: Oracle, Google Cloud, AWS and Azure all want one for identity checks
# even on tiers that never charge. 750 instance-hours a month covers one
# service running continuously.
#
# The database lives outside Render. Render's own free Postgres is deleted 30
# days after creation, and this app speaks MySQL (pymysql) rather than
# Postgres, so DATABASE_URL points at a free managed MySQL instead — TiDB
# Cloud Starter, or Aiven for MySQL. Neither needs a card either.
#
# Create the service from this file: Render dashboard → New → Blueprint →
# pick this repository. Full walkthrough in docs/deployment-render.md.
services:
  - type: web
    name: api-security-monitor
    # Runs the multi-arch image CD already published rather than rebuilding.
    # A from-source build here would repeat the frontend and wheel steps on a
    # free builder for ten-plus minutes on every deploy, to produce something
    # CI has already built and tested.
    runtime: image
    plan: free
    # Singapore rather than a US region: the app makes a database round-trip
    # per request, so the service and the database want to be in the same
    # region. Pair this with a TiDB cluster in ap-southeast-1.
    region: singapore
    image:
      # Pinned to a commit rather than :latest. Image-backed services do not
      # auto-deploy on a new push to the tag, so a floating tag buys nothing
      # and only hides which build is actually live. This commit is the last
      # one CD published; app/, frontend/, alembic/, requirements.lock and
      # the Dockerfile are unchanged since — the revert that followed it
      # touched only deployment files and docs.
      url: ghcr.io/dharuneshboopathy/secure-api:62a8a51e96a0d3a0c30a3631d73ff12782e98796

    # Render assigns a port through $PORT and routes to it; the image's own
    # CMD hardcodes 8000, so the command is restated here to honour it. The
    # fallback keeps the same line working under plain `docker run`.
    # --proxy-headers because Render terminates TLS in front of the service —
    # without it slowapi sees the proxy as the only client and rate-limits
    # every visitor together.
    dockerCommand: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}
      --proxy-headers --forwarded-allow-ips='*'"

    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production
      # sync: false means Render prompts for this instead of reading it from
      # here — this file is public and the URL carries the password. Paste the
      # MySQL connection string from TiDB Cloud or Aiven, TLS parameters
      # included; see docs/deployment-render.md for the exact shape.
      - key: DATABASE_URL
        sync: false
      # The demo/debug router is documented as development-only (app/config.py).
      # The earlier draft of this file enabled it because the database was
      # wiped on every deploy; it is durable now, and public, so it stays off.
      - key: ENABLE_DEMO
        value: "false"
      - key: EXPOSE_API_DOCS
        value: "false"
      - key: ALLOW_QUERY_AUTH
        value: "false"
      # Generated by Render at creation and never shown in the repo. Both must
      # clear 32 characters or the production guard refuses to boot.
      - key: SECRET_KEY
        generateValue: true
      - key: MONITOR_API_KEY
        generateValue: true
      # Pinned separately rather than left to derive from SECRET_KEY, which is
      # what happens when it is unset (app/services/crypto.py). With a durable
      # database that derivation is a trap: rotating SECRET_KEY would make
      # every stored provider credential permanently undecryptable.
      - key: ENCRYPTION_KEY
        generateValue: true
      # sync: false here too — Render prompts rather than reading them from a
      # public file. Use anything but `admin`, and a strong password: this
      # instance is on the open internet.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Retrain rebuilds a pandas DataFrame from every traffic event in the
      # lookback window. On the 512 MB free plan, with a database that now
      # keeps growing, the default 15 minutes is more often than this instance
      # wants. See the memory section in docs/deployment-render.md.
      - key: ML_RETRAIN_MINUTES
        value: "60"
