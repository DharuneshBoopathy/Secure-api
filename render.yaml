# Render Blueprint — free-plan deployment of the released image.
#
# Render's free plan needs no payment card, which is what rules the cloud VMs
# out: Oracle, Google Cloud, AWS and Azure all want one for identity checks
# even on tiers that never charge. 750 instance-hours a month covers one
# service running continuously.
#
# The database lives outside Render, and on this plan it has to. A free service
# gets no persistent disk — `disk:` is a paid-instance feature, so there is no
# spelling of this file that keeps a file-backed database — and it spins down
# after ~15 minutes of inactivity, returning on the next request as a fresh
# container. Anything written inside that container is gone by then. Measured
# on the live service: a cold /health answers in ~86s, a warm one in ~0.5s.
#
# That is not a theoretical risk. It already cost this deployment its audit
# log: DATABASE_URL was resolving to the app's SQLite default, every wake-up
# started an empty database, and ensure_default_admin recreated the admin
# account on each boot so the instance still looked healthy. The app now
# refuses to start in production on an unset, blank, or SQLite DATABASE_URL
# (app/config.py::validate_security_settings) rather than lose data quietly.
#
# Render's own free Postgres is deleted 30 days after creation, and this app
# speaks MySQL (pymysql) rather than Postgres, so DATABASE_URL points at a free
# managed MySQL instead — TiDB Cloud Starter, or Aiven for MySQL. Neither needs
# a card either.
#
# Create the service from this file: Render dashboard → New → Blueprint →
# pick this repository. Full walkthrough in docs/deployment-render.md.
services:
  - type: web
    name: api-security-monitor
    # Runs the multi-arch image CD already published rather than rebuilding.
    # A from-source build here would repeat the frontend and wheel steps on a
    # free builder for ten-plus minutes on every deploy, to produce something
    # CI has already built and tested.
    runtime: image
    plan: free
    # Singapore rather than a US region: the app makes a database round-trip
    # per request, so the service and the database want to be in the same
    # region. Pair this with a TiDB cluster in ap-southeast-1.
    region: singapore
    image:
      # Pinned to a commit rather than :latest. Image-backed services do not
      # auto-deploy on a new push to the tag, so a floating tag buys nothing
      # and only hides which build is actually live.
      #
      # fc04caf is main, published by CD run 31666842618 as a multi-arch
      # manifest (linux/amd64 + linux/arm64). It carries the super-admin tier,
      # the audit-log fixes, and the DATABASE_URL boot guard — which means this
      # image will not start until DATABASE_URL names a durable database. That
      # is deliberate; see the header comment.
      url: ghcr.io/dharuneshboopathy/secure-api:fc04caf0e85f422026cac78ff27576e490aa986c

    # Deliberately no dockerCommand. The image's own CMD already chains
    # `alembic upgrade head && uvicorn ...`, and it works because Docker runs
    # a real shell for it. Render does not: it splits dockerCommand into argv
    # and execs it directly, with no shell anywhere. Both obvious spellings
    # were tried against the live service and both failed —
    #
    #   dockerCommand: sh -c "alembic upgrade head && uvicorn ..."
    #     -> sh: 1: alembic upgrade head && uvicorn ...: not found  (exit 127)
    #        the quoting does not survive Render's parser, so the whole
    #        string arrives as a single command name
    #
    #   dockerCommand: alembic upgrade head && uvicorn ...
    #     -> alembic: error: unrecognized arguments: && uvicorn ...  (exit 2)
    #        no shell, so && is just another argv entry
    #
    # So the override is dropped and the two things it existed for are set as
    # environment variables below instead.

    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production
      # Render normally assigns a port and expects the service to bind $PORT;
      # the image's CMD hardcodes 8000 and there is no dockerCommand left to
      # restate it. Setting PORT to 8000 moves Render to the image instead of
      # the other way round.
      - key: PORT
        value: "8000"
      # uvicorn's env-var spelling of --forwarded-allow-ips. Render terminates
      # TLS in front of the service, and uvicorn only trusts proxy headers
      # from 127.0.0.1 by default — without this slowapi sees the proxy as the
      # only client and rate-limits every visitor together. --proxy-headers
      # itself needs no flag: it is on by default in uvicorn.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # REQUIRED — the service will not boot without it, by design. sync: false
      # means Render prompts for this instead of reading it from here, because
      # this file is public and the URL carries the password. Paste the MySQL
      # connection string from TiDB Cloud or Aiven, TLS parameters included;
      # see docs/deployment-render.md for the exact shape.
      #
      # Skipping the prompt does not fall back to something harmless: it leaves
      # the app on its container-local SQLite default, which this plan discards
      # on every spin-down. Production now treats that as a fatal misconfig, so
      # a skipped prompt fails the deploy instead of silently losing every
      # table between visits. Set it before deploying, not after.
      - key: DATABASE_URL
        sync: false
      # The demo/debug router is documented as development-only (app/config.py).
      # The earlier draft of this file enabled it because the database was
      # wiped on every deploy — which, it turned out, remained true long after
      # this comment claimed otherwise. The boot guard above is what actually
      # makes durability hold; the instance is public either way, so it stays
      # off.
      - key: ENABLE_DEMO
        value: "false"
      - key: EXPOSE_API_DOCS
        value: "false"
      - key: ALLOW_QUERY_AUTH
        value: "false"
      # Generated by Render at creation and never shown in the repo. Both must
      # clear 32 characters or the production guard refuses to boot.
      - key: SECRET_KEY
        generateValue: true
      - key: MONITOR_API_KEY
        generateValue: true
      # Pinned separately rather than left to derive from SECRET_KEY, which is
      # what happens when it is unset (app/services/crypto.py). With a durable
      # database that derivation is a trap: rotating SECRET_KEY would make
      # every stored provider credential permanently undecryptable.
      - key: ENCRYPTION_KEY
        generateValue: true
      # sync: false here too — Render prompts rather than reading them from a
      # public file. Use anything but `admin`, and a strong password: this
      # instance is on the open internet.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Retrain rebuilds a pandas DataFrame from every traffic event in the
      # lookback window. On the 512 MB free plan, with a database that now
      # keeps growing, the default 15 minutes is more often than this instance
      # wants. See the memory section in docs/deployment-render.md.
      - key: ML_RETRAIN_MINUTES
        value: "60"
