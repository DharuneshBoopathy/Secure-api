# Production overlay — public, internet-facing single-host deployment.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Note the explicit -f flags: they deliberately exclude docker-compose.override.yml,
# which sets APP_ENV=development and would disable production's strict security
# validation (app/config.py::validate_security_settings).
#
# REQUIRES Docker Compose v2.24+ for the `!override` tag. Check with
# `docker compose version`. Without it, the base `ports` lists are *concatenated*
# rather than replaced and every service stays bound to 0.0.0.0.
#
# What this overlay changes:
#   1. Nothing but Caddy publishes to the internet. Every other service is rebound
#      to 127.0.0.1, reachable only via SSH tunnel (see docs/deployment-oracle-free.md).
#   2. Caddy terminates TLS on 80/443 with automatic Let's Encrypt certificates and
#      proxies to the existing nginx, which keeps its rate limiting and its
#      credential-redacting JSON access log.
#   3. uvicorn is told to trust proxy headers so per-client rate limiting works.
#   4. web and worker run the multi-arch image CD publishes to GHCR rather than
#      building on the host. Building in place costs about ten minutes on an
#      Ampere A1 and the frontend stage is the memory spike most likely to get
#      the container OOM-killed on first boot; pulling takes about a minute and
#      ships the exact artifact CI tested. Both services still inherit `build:`
#      from the base file, so pass --no-build (see below) to be certain a stale
#      local tree can never be substituted for the released image.
#
# Required in .env beyond the base stack:
#   PUBLIC_HOSTNAME=yourname.duckdns.org
#   ACME_EMAIL=you@example.com
#
# Optional: APIMONITOR_IMAGE pins a specific release instead of :latest, e.g.
#   APIMONITOR_IMAGE=ghcr.io/dharuneshboopathy/secure-api:<commit-sha>
# Pinning is what makes a rollback possible — set it to the previous sha and
# re-run the pull/up pair.

services:
  caddy:
    image: caddy:2-alpine
    container_name: apimonitor-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?Required — set PUBLIC_HOSTNAME in .env (e.g. yourname.duckdns.org)}
      ACME_EMAIL: ${ACME_EMAIL:?Required — set ACME_EMAIL in .env (Let's Encrypt expiry notices)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Named volumes, not bind mounts: issued certificates live in /data and must
      # survive `docker compose down`, or every redeploy re-requests from Let's
      # Encrypt and burns the 5-per-week duplicate-certificate rate limit.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  nginx:
    # No longer public — Caddy is the only ingress. nginx stays in the path for its
    # limit_req zone and its `auth=` query-parameter redaction (nginx/nginx.conf).
    ports: !override []

  web:
    image: ${APIMONITOR_IMAGE:-ghcr.io/dharuneshboopathy/secure-api:latest}
    pull_policy: always
    # Behind two proxies, uvicorn sees the proxy's IP as the client unless it is told
    # to honour X-Forwarded-For, which would make slowapi rate-limit the entire
    # internet as a single client. Safe to trust unconditionally here precisely
    # because port 8000 is loopback-only and Caddy is the sole path in.
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
        --proxy-headers --forwarded-allow-ips='*'
    environment:
      APP_ENV: production
      CORS_ORIGINS: https://${PUBLIC_HOSTNAME}
      PUBLIC_BASE_URL: https://${PUBLIC_HOSTNAME}
      # Explicit rather than relying on the defaults: interactive API docs and the
      # demo router are attack surface on a public host.
      EXPOSE_API_DOCS: "false"
      ENABLE_DEMO: "false"
      ALLOW_QUERY_AUTH: "false"
    ports: !override
      - "127.0.0.1:8000:8000"

  worker:
    image: ${APIMONITOR_IMAGE:-ghcr.io/dharuneshboopathy/secure-api:latest}
    pull_policy: always
    environment:
      APP_ENV: production

  mysql:
    ports: !override
      - "127.0.0.1:3306:3306"

  grafana:
    ports: !override
      - "127.0.0.1:3000:3000"

  prometheus:
    ports: !override
      - "127.0.0.1:9090:9090"

  alertmanager:
    ports: !override
      - "127.0.0.1:9093:9093"

  jaeger:
    ports: !override
      - "127.0.0.1:16686:16686"

  loki:
    ports: !override
      - "127.0.0.1:3100:3100"

volumes:
  caddy_data:
  caddy_config:
