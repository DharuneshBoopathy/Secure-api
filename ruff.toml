# Explicit lint contract.
#
# CI installs ruff unpinned, and ruff's *default* rule set is not stable across
# releases: 0.16 widened it, which turned a green `ruff check app` red on a
# commit that changed no Python at all. 185 of those new findings were B008
# ("no function call in argument defaults") firing on `Depends(...)`, which is
# the prescribed FastAPI idiom and not something this codebase should change.
#
# The selection below is ruff's historical default — pyflakes plus the
# pycodestyle error subset — so the gate now means the same thing on every ruff
# version instead of drifting with the tool. Widening it is worthwhile but is
# its own task: the remaining candidates are I001 (import sorting, 15),
# BLE001 (blind `except Exception`, 13), S110/S112 (`try`/`except`/`pass`, 3)
# and a handful of C408/UP035/PERF102, each of which needs its findings
# triaged rather than bulk-fixed.

[lint]
select = ["E4", "E7", "E9", "F"]
