name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # The lockfile is what actually ships (Dockerfile installs from it), so
      # a requirements.txt edit that never made it into the lock would be a
      # change nobody deploys. Recompiling and diffing catches that drift.
      #
      # --universal resolves for every platform at once and emits environment
      # markers, rather than resolving for whichever OS ran the compile. A
      # platform-specific lock cannot work here: compiled on Windows it omits
      # uvloop and Linux installs die with "all requirements must be pinned
      # upfront with ==, but found: uvloop"; compiled on Linux it omits
      # colorama and breaks Windows dev machines the same way. Both this
      # command and the one in the error message below must keep the flag.
      #
      # uv is pinned because the diff compares generated output byte for byte
      # — an unpinned `pipx run uv` lets a new uv release with different
      # formatting fail this gate on a commit that changed no dependencies.
      #
      # The check file is seeded from the committed lock first. uv keeps the
      # pins already present in its output file unless requirements.txt forces
      # a change, so seeding asks the question we actually care about — "does
      # the lock still satisfy requirements.txt?" — instead of "has anything
      # on PyPI been released since the lock was written?". Compiling into an
      # empty path re-resolves every `>=` floor to whatever is newest that
      # minute, which turns this gate red on commits that touched nothing.
      # Verified it still fails when requirements.txt gains a package the
      # lock lacks.
      - name: Verify requirements.lock is up to date
        run: |
          cp requirements.lock /tmp/requirements.check
          pipx run --spec uv==0.12.3 uv pip compile requirements.txt \
            --generate-hashes --universal --python-version 3.12 \
            -o /tmp/requirements.check
          diff <(grep -v '^#' requirements.lock) <(grep -v '^#' /tmp/requirements.check) \
            || { echo "::error::requirements.lock is stale — re-run: uv pip compile requirements.txt --generate-hashes --universal --python-version 3.12 -o requirements.lock"; exit 1; }
      - run: "pip install --only-binary :all: --require-hashes -r requirements.lock"
      # Pinned deliberately. These gate the build, and an unpinned linter makes
      # CI a function of the latest upstream release rather than of this
      # commit: ruff 0.16 widened its default rule set and failed a tree that
      # had not changed. ruff.toml fixes which rules run; this fixes which
      # implementation of them runs. Bump on purpose, not by surprise.
      - run: "pip install --only-binary :all: ruff==0.16.2 mypy==2.3.0"
      - run: ruff check app
      - run: mypy app --ignore-missing-imports
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
        working-directory: frontend
      # Errors gate the build; the pre-existing warnings are visible in the
      # log without blocking. See eslint.config.js for which is which.
      - run: npm run lint:ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: "pip install --only-binary :all: --require-hashes -r requirements.lock"
      # Pinned like the linters above so a tooling release cannot fail a build
      # on unchanged code. httpx is intentionally absent — the lockfile above
      # already installs it, pinned and hash-verified.
      - run: >-
          pip install --only-binary :all:
          pytest==9.1.1 pytest-cov==7.1.0 pytest-asyncio==1.4.0
          faker==40.36.0 "fakeredis[lua]==2.37.0"
      - run: pytest

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run test
        working-directory: frontend

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: "pip install --only-binary :all: --require-hashes -r requirements.lock"
      # bandit is pinned for the same reason as ruff/mypy above — it is a
      # blocking gate, so a new release adding a check would fail an unchanged
      # tree. safety and pip-audit are informational below and float on
      # purpose: for those, "the advisory database got newer" is the point.
      - run: "pip install --only-binary :all: bandit==1.9.4 safety==3.8.1 pip-audit==2.10.1"
      - run: bandit -r app
      - run: safety check || true
      # pip-audit checks the resolved environment against the PyPI/OSV
      # advisory databases. Direct deps with known-CVE floors (PyJWT,
      # python-multipart) have already been bumped in requirements.txt, but
      # several *transitive* deps pulled in via fastapi[standard] /
      # pydantic-settings (starlette, cryptography, urllib3, idna) still
      # resolve to versions with open advisories as of this writing. Left
      # informational until those floors are raised too — flip to blocking
      # (drop `|| true`) once a clean run is confirmed.
      - run: pip-audit || true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
        working-directory: frontend
      # Blocking gate: production dependencies only, high/critical severity.
      # Dev-only tooling (vite/vitest/esbuild, etc.) never ships in the built
      # bundle, so it's scanned informationally below instead of gating CI.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm audit --audit-level=high || true
        working-directory: frontend

  # SAST across both app/ (Python) and frontend/src (TS/React) via Semgrep's
  # public OSS registry rules — no Semgrep Cloud account/token required.
  # Informational for now (continue-on-error) — no baseline triage of
  # findings has been done yet; drop continue-on-error once that's complete.
  semgrep-sast:
    name: semgrep-oss/scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: semgrep scan --config p/ci

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t secure-api-monitor:ci .
      # Informational: full severity range, visible in the job log, never blocks.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: secure-api-monitor:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
      # Blocking gate: CRITICAL only, and only CVEs with an available fix —
      # unfixed base-image CVEs would otherwise block every merge with no
      # action the team can take. Not verified locally (no Docker daemon in
      # this environment) — watch the first run and adjust severity/ignore
      # rules if it surfaces something that isn't actionable.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: secure-api-monitor:ci
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
