name: CD

# Runs only after CI (ci.yml) finishes successfully on main — never deploys
# a commit that hasn't passed lint/type-check/tests/security-scan.
#
# Requires repo setup this workflow can't do for you (see README's
# "Kubernetes deployment" section):
#   1. A `production` GitHub Environment (Settings > Environments) with
#      required reviewers configured — THAT is the actual manual-approval
#      gate; `environment:` below only targets it, the approval rule itself
#      is a repo setting, not expressible in workflow YAML.
#   2. A `KUBE_CONFIG_PRODUCTION` repo/environment secret: a base64-encoded
#      kubeconfig with access to the target cluster.
#   3. GHCR write access, which the default GITHUB_TOKEN already has as
#      long as the repo's Actions settings permit package publishing.
# Until those exist, deploy-production will fail at the "configure
# kubeconfig" step — build-and-push still works on its own.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}
            ghcr.io/${{ github.repository }}:latest

  deploy-production:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://apimonitor.example.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig.yaml
      - name: Run database migrations
        env:
          KUBECONFIG: kubeconfig.yaml
        # Delete-then-apply because Job specs are immutable in place — see
        # the comment in k8s/migrate-job.yaml.
        run: |
          kubectl delete job apimonitor-migrate --ignore-not-found
          kubectl apply -f k8s/migrate-job.yaml
          kubectl wait --for=condition=complete job/apimonitor-migrate --timeout=120s
      - name: Roll out
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          kubectl set image deployment/apimonitor-web web=${{ needs.build-and-push.outputs.image }}
          kubectl set image deployment/apimonitor-worker worker=${{ needs.build-and-push.outputs.image }}
          kubectl rollout status deployment/apimonitor-web --timeout=180s
          kubectl rollout status deployment/apimonitor-worker --timeout=180s
      - name: Clean up kubeconfig
        if: always()
        run: rm -f kubeconfig.yaml
