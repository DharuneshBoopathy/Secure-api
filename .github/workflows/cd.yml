name: CD

# Runs only after CI (ci.yml) finishes successfully on main — never publishes
# a commit that hasn't passed lint/type-check/tests/security-scan.
#
# Publishes a multi-architecture image to GHCR:
#   ghcr.io/<owner>/<repo>:latest  and  :<commit-sha>
#
# linux/arm64 is not optional here — the documented deployment target is an
# Oracle Cloud Ampere A1 host (see docs/deployment-oracle-free.md), and an
# amd64-only image simply will not run on it. Each architecture is built on a
# runner of that architecture rather than under QEMU: emulated Node segfaults
# on the frontend build often enough to matter, and native is minutes instead
# of tens of minutes. GitHub's arm64 runners are free for public repositories.
#
# deploy-production targets Kubernetes and is skipped unless
# KUBE_CONFIG_PRODUCTION exists, so this workflow is green on a single-host
# deployment while staying ready if a cluster is ever added. To enable it:
#   1. A `production` GitHub Environment (Settings > Environments) with
#      required reviewers — THAT is the manual-approval gate; `environment:`
#      below only targets it, the rule itself is a repo setting.
#   2. A `KUBE_CONFIG_PRODUCTION` secret: base64-encoded kubeconfig.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  build:
    # The head_repository check is belt and braces on top of `branches: [main]`
    # above: workflow_run carries the triggering run's head SHA, and this job
    # checks that SHA out and builds it with packages:write. Requiring the run
    # to have come from this repository means a fork can never reach the push
    # credentials, independently of how the trigger filter behaves.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # GITHUB_REPOSITORY is "DharuneshBoopathy/Secure-api", but an OCI
      # reference must be lowercase — docker rejects the mixed-case form
      # outright with "repository name must be lowercase", which is why this
      # workflow never published anything. ${VAR,,} lowercases it.
      - name: Resolve image name and platform tag
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "PLATFORM_TAG=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only, with no tag. The merge job below stitches the
      # per-architecture digests into one tagged manifest list, so a tag never
      # points at a half-published set of architectures.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ env.PLATFORM_TAG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: ref
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "image=$image:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:${{ github.event.workflow_run.head_sha }}" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Show published architectures
        run: docker buildx imagetools inspect "$IMAGE:latest"

  # Secrets cannot be referenced in a job-level `if:`, so the check is its own
  # job whose output can be.
  check-deploy-config:
    needs: merge
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          KUBE_CONFIG_PRODUCTION: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
        run: |
          if [ -n "$KUBE_CONFIG_PRODUCTION" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KUBE_CONFIG_PRODUCTION is not set — skipping the Kubernetes rollout. The image was published to GHCR; a single-host deployment pulls it directly (docs/deployment-oracle-free.md)."
          fi

  deploy-production:
    needs: [merge, check-deploy-config]
    if: needs.check-deploy-config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://apimonitor.example.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
      # Passed through env rather than interpolated into the script body. A
      # ${{ secrets.* }} expansion is substituted into the command text before
      # the shell runs, so the value can surface in traces and is one `set -x`
      # from the log; as an env var the runner's masking still applies.
      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_PRODUCTION: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
        run: printf '%s' "$KUBE_CONFIG_PRODUCTION" | base64 -d > kubeconfig.yaml
      - name: Run database migrations
        env:
          KUBECONFIG: kubeconfig.yaml
        # Delete-then-apply because Job specs are immutable in place — see
        # the comment in k8s/migrate-job.yaml.
        run: |
          kubectl delete job apimonitor-migrate --ignore-not-found
          kubectl apply -f k8s/migrate-job.yaml
          kubectl wait --for=condition=complete job/apimonitor-migrate --timeout=120s
      - name: Roll out
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          kubectl set image deployment/apimonitor-web web=${{ needs.merge.outputs.image }}
          kubectl set image deployment/apimonitor-worker worker=${{ needs.merge.outputs.image }}
          kubectl rollout status deployment/apimonitor-web --timeout=180s
          kubectl rollout status deployment/apimonitor-worker --timeout=180s
      - name: Clean up kubeconfig
        if: always()
        run: rm -f kubeconfig.yaml
