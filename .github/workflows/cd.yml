name: CD

# MANUAL ONLY — this workflow does not run on its own.
#
# There is no active deployment for this project, so nothing should be
# publishing release images on a schedule nobody is consuming. It previously
# ran automatically after every green CI run on main and pushed to GHCR; that
# trigger is removed rather than the workflow, because the pipeline itself is
# correct and re-enabling it is a two-line change (restore the `workflow_run`
# block below). Run it by hand from the Actions tab if you ever want an image.
#
# Publishes a multi-architecture image (linux/amd64 + linux/arm64) to GHCR as
# ghcr.io/<owner>/<repo>:latest and :<commit-sha>. Each architecture builds on
# a runner of that architecture rather than under QEMU, where the Node
# frontend build segfaults often enough to matter.
#
# deploy-production targets Kubernetes and is skipped unless
# KUBE_CONFIG_PRODUCTION exists. To enable it:
#   1. A `production` GitHub Environment (Settings > Environments) with
#      required reviewers — THAT is the manual-approval gate; `environment:`
#      below only targets it, the rule itself is a repo setting.
#   2. A `KUBE_CONFIG_PRODUCTION` secret: base64-encoded kubeconfig.
#
# To restore automatic publishing, replace the `on:` block with:
#   on:
#     workflow_run:
#       workflows: ["CI"]
#       types: [completed]
#       branches: [main]

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # GITHUB_REPOSITORY is "DharuneshBoopathy/Secure-api", but an OCI
      # reference must be lowercase — docker rejects the mixed-case form
      # outright with "repository name must be lowercase", which is why this
      # workflow never published anything. ${VAR,,} lowercases it.
      - name: Resolve image name and platform tag
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "PLATFORM_TAG=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only, with no tag. The merge job below stitches the
      # per-architecture digests into one tagged manifest list, so a tag never
      # points at a half-published set of architectures.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ env.PLATFORM_TAG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: ref
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "image=$image:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:${{ github.sha }}" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Show published architectures
        run: docker buildx imagetools inspect "$IMAGE:latest"

  # Secrets cannot be referenced in a job-level `if:`, so the check is its own
  # job whose output can be.
  check-deploy-config:
    needs: merge
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          KUBE_CONFIG_PRODUCTION: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
        run: |
          if [ -n "$KUBE_CONFIG_PRODUCTION" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KUBE_CONFIG_PRODUCTION is not set — skipping the Kubernetes rollout. The image was published to GHCR and can be pulled from there."
          fi

  deploy-production:
    needs: [merge, check-deploy-config]
    if: needs.check-deploy-config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://apimonitor.example.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
      # Passed through env rather than interpolated into the script body. A
      # ${{ secrets.* }} expansion is substituted into the command text before
      # the shell runs, so the value can surface in traces and is one `set -x`
      # from the log; as an env var the runner's masking still applies.
      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_PRODUCTION: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
        run: printf '%s' "$KUBE_CONFIG_PRODUCTION" | base64 -d > kubeconfig.yaml
      - name: Run database migrations
        env:
          KUBECONFIG: kubeconfig.yaml
        # Delete-then-apply because Job specs are immutable in place — see
        # the comment in k8s/migrate-job.yaml.
        run: |
          kubectl delete job apimonitor-migrate --ignore-not-found
          kubectl apply -f k8s/migrate-job.yaml
          kubectl wait --for=condition=complete job/apimonitor-migrate --timeout=120s
      - name: Roll out
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          kubectl set image deployment/apimonitor-web web=${{ needs.merge.outputs.image }}
          kubectl set image deployment/apimonitor-worker worker=${{ needs.merge.outputs.image }}
          kubectl rollout status deployment/apimonitor-web --timeout=180s
          kubectl rollout status deployment/apimonitor-worker --timeout=180s
      - name: Clean up kubeconfig
        if: always()
        run: rm -f kubeconfig.yaml
